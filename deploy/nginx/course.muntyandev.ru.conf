# Nginx configuration for Course App Frontend SPA
# Domain: course.muntyandev.ru
# Target: /var/www/course-app/frontend/dist

# HTTP server block: redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name course.muntyandev.ru;

    # Certbot challenge location for Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all remaining traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name course.muntyandev.ru;

    # SSL Certificates (managed via Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/course.muntyandev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/course.muntyandev.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Root directory for Vite static build output
    root /var/www/course-app/frontend/dist;
    index index.html;

    # Charset
    charset utf-8;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip compression for static text/code assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Hashed static assets (Vite adds content hashes to /assets/*)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # HTML index file: must not be cached indefinitely so new deploys are loaded immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA rewrite fallback rule:
    # All client-side React Router routes (/assignments, /assignments/:id, /auth, etc.)
    # fall back to /index.html so browser refresh never returns 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Custom logging
    access_log /var/log/nginx/course.muntyandev.ru.access.log;
    error_log /var/log/nginx/course.muntyandev.ru.error.log warn;
}
