# Nginx configuration for Course App Frontend SPA (Cloudflare Tunnel mode)
# Domain: course.muntyandev.ru
# Target: /var/www/course-app/frontend/dist
#
# When using Cloudflare Tunnel, SSL is terminated at Cloudflare Edge.
# Traffic arrives at Nginx over local HTTP (port 80).

server {
    listen 80;
    listen [::]:80;
    server_name course.muntyandev.ru;

    # Root directory for Vite static build output
    root /var/www/course-app/frontend/dist;
    index index.html;

    # Charset
    charset utf-8;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Hashed static assets (Vite adds content hashes to /assets/*)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # HTML index file: must not be cached indefinitely
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA rewrite fallback rule
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Custom logging
    access_log /var/log/nginx/course.muntyandev.ru.access.log;
    error_log /var/log/nginx/course.muntyandev.ru.error.log warn;
}
